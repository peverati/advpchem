project:
  type: website
  output-dir: _site
  resources:
    - data/**
    - components/**
    - notebooks/**
    - downloads/**
    - images/logo-light.png
    - images/logo-dark.png
  render:
    - "*.qmd"
    - "guides/*.qmd"
    - "experiments/*.qmd"
    - "lectures/*.qmd"
    - "!README.md"
    - "!slides/"
    - "!instructor/"

