link-citations: true

# Where the Colab notebooks live once this folder is pushed to GitHub.
# Replace OWNER/REPO with the real repository (used by the "Open in Colab" badges).
colab-base: "https://colab.research.google.com/github/OWNER/REPO/blob/main/notebooks"

# Semester settings (Microsoft Form links, due dates, results release) live in
# data/course.json so the interactive components can read them in the browser.

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    smooth-scroll: true
    code-copy: true
    lang: en
    include-after-body:
      - includes/lab-logo.html
    include-in-header:
      - text: |
          <script src="https://cdn.jsdelivr.net/npm/3dmol@2.4.2/build/3Dmol-min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
